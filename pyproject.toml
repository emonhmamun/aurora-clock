# Aurora Clock - tooling configuration.
# The application itself is not pip-installable on purpose: it is a desktop
# program, not a library. This file configures the linter and the test runner.

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git", ".venv", "venv", "build", "dist",
    "build_assets/build", "build_assets/dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "E501",    # line length is checked by the `line-length` setting above
    "E702",    # `p.setPen(...); p.setBrush(...)` pairs read better on one line
               # in the painting code, and are used deliberately throughout
    "B008",    # function call in a default argument - normal with Qt
    "SIM108",  # a ternary is not always clearer than if/else
    "SIM105",  # contextlib.suppress is not clearer than a bare try/except pass
    # The codebase targets Python 3.9, so the typing module spellings stay:
    "UP006", "UP035", "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]          # fixtures import for side effects
"aurora/faces.py" = ["E741"]          # single-letter maths variables are clearer here
"build_assets/*" = ["E401", "E402"]   # standalone build scripts

[tool.ruff.lint.isort]
known-first-party = ["aurora"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --tb=short"
filterwarnings = [
    "error::DeprecationWarning:aurora.*",
]
